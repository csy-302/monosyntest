<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>흑백 증후군 | Monochrome Syndrome</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-green: #4CAF50;
            --accent-blue: #2196F3;
            --border-color: #333333;
            --card-bg: #1e1e1e;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1024px;
            margin: 0 auto;
            padding: 0 20px;
        }

        section {
            padding: 100px 0;
            border-bottom: 1px solid var(--border-color);
        }

        h2, h3 {
            font-weight: 700;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 2.5rem;
            text-align: center;
        }
        
        /* 일러스트 섹션 아래 간격 50px 추가 */
        .illustration-section {
            margin-bottom: 50px;
        }

        .illustration-container img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain; 
            display: block;
            margin: 0 auto;
        }
        
        /* 히어로 섹션 */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            border-bottom: none;
            position: relative;
        }

        /* 새로 추가된 로고 이미지 스타일 */
        .hero-logo {
            width: 100%;
            max-width: 500px; /* 로고의 최대 크기 제한 */
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5)); /* 로고를 배경과 돋보이게 하는 그림자 */
        }

        .hero p.logline {
            font-size: 1.2rem;
            color: #aaaaaa;
            max-width: 600px;
            margin-bottom: 40px;
            word-break: keep-all;
            transition: all 0.5s ease;
        }

        /* 스토리 그리드 */
        .story-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .story-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .story-card:hover {
            transform: translateY(-5px);
        }

        /* 시나리오 카드 배경색 지정 */
        .card-prologue { background-color: #666666; }
        .card-chapter1 { background-color: var(--accent-green); }
        .card-chapter2 { background-color: var(--accent-blue); }
        
        /* 시나리오 카드 글자색 흰색으로 고정 */
        .card-prologue h3, .card-prologue p,
        .card-chapter1 h3, .card-chapter1 p,
        .card-chapter2 h3, .card-chapter2 p {
            color: #ffffff !important;
        }

        .next-story {
            text-align: center;
            margin-top: 50px;
            font-size: 1.2rem;
            color: #888;
            font-style: italic;
        }

        /* 캐릭터 섹션 */
        .character-wrap {
            display: flex;
            gap: 50px;
            margin-top: 50px;
            justify-content: center;
        }

        .character {
            text-align: center;
            max-width: 300px;
        }

        .character-img {
            width: 200px;
            height: 250px;
            background-color: #2a2a2a;
            border-radius: 10px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            overflow: hidden; /* 이미지가 박스를 벗어나지 않도록 설정 */
        }
        
        /* 캐릭터 이미지 핏 설정 */
        .character-img img {
            width: 100%;
            height: 100%;
            object-fit
