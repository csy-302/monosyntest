<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>흑백 증후군</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--panel:rgba(12,12,12,.94);--line:#cfcfcf;--dim:#7a7a7a;--text:#f2f2f2}
*{box-sizing:border-box;margin:0;user-select:none}
html,body{height:100%;background:#000;overflow:hidden;font-family:'Noto Serif KR','Malgun Gothic',serif;color:var(--text)}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;container-type:size;overflow:hidden;background:var(--bg)}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
/* 배경 (나중에 이미지로 교체: --bg-image) */
.bg{position:absolute;inset:0;background:var(--bg-image,none),radial-gradient(ellipse at 60% 20%,#8a8a8a 0,#3a3a3a 35%,#0d0d0d 80%);background-size:cover;background-position:center}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.6))}
/* 타이틀 */
#title .bg{background:var(--title-image,none),radial-gradient(ellipse at 70% 50%,#4a4a4a 0,#151515 60%,#050505 100%);background-size:cover;background-position:center}
#logo{position:absolute;left:5cqw;top:6cqh;width:40cqw;height:auto;filter:drop-shadow(0 0 1.2cqw rgba(255,255,255,.25))}
#menu{position:absolute;left:9cqw;top:60cqh;display:flex;flex-direction:column;align-items:flex-start;gap:1.4cqh}
.mi{font-size:2.8cqw;color:var(--dim);cursor:pointer;padding:.3cqw 1cqw .3cqw 3cqw;position:relative;transition:.15s}
.mi.sel{color:#fff;text-shadow:0 0 1.2cqw #fff9}
.mi.sel::before{content:'→';position:absolute;left:0}
.hint{position:absolute;left:2cqw;bottom:2cqh;font-size:1.3cqw;color:var(--dim)}
/* 캐릭터 */
.chr{position:absolute;bottom:0;transition:opacity .3s,filter .3s,transform .3s;opacity:0}
.chr.show{opacity:1}.chr.dim{filter:brightness(.55)}
#girl{left:7cqw;width:30cqw;height:78cqh}
#mono{right:13cqw;width:22cqw;height:52cqh;bottom:24cqh}
.chr svg,.chr img{width:100%;height:100%}
/* 사이드 아이콘 */
#side{position:absolute;right:1.6cqw;top:3cqh;display:flex;flex-direction:column;gap:2.4cqh;z-index:5}
.ib{width:4.2cqw;height:4.2cqw;border:.15cqw solid var(--line);border-radius:.8cqw;background:rgba(0,0,0,.55);color:var(--text);cursor:pointer;font-size:2.2cqw;display:flex;align-items:center;justify-content:center;transition:.15s}
.ib:hover{background:#fff;color:#000}
/* 대화 상자 */
#box{position:absolute;left:3cqw;right:3cqw;bottom:4cqh;height:26cqh;background:var(--panel);border:.18cqw solid var(--line);clip-path:polygon(1.2cqw 0,100% 0,100% calc(100% - 1.2cqw),calc(100% - 1.2cqw) 100%,0 100%,0 1.2cqw);padding:2.4cqh 3cqw}
#name{font-size:2cqw;font-weight:700;padding-bottom:.8cqh;border-bottom:.1cqw solid #555;width:22cqw;min-height:3.4cqh;margin-bottom:1.6cqh}
#txt{font-size:2cqw;line-height:1.7;letter-spacing:.03em}
#arrow{position:absolute;right:2.4cqw;bottom:2cqh;font-size:1.6cqw;animation:bl 1s infinite;display:none}
@keyframes bl{50%{opacity:.2}}
/* 팝업 공통 */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20}
.modal.on{display:flex}
.pop{position:relative;width:88cqw;height:84cqh;background:var(--panel);border:.18cqw solid var(--line);clip-path:polygon(1.4cqw 0,100% 0,100% calc(100% - 1.4cqw),calc(100% - 1.4cqw) 100%,0 100%,0 1.4cqw);padding:2.5cqh 2.5cqw;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:1.2cqw;font-size:2.6cqw;font-weight:700;padding-bottom:1.6cqh;border-bottom:.1cqw solid #666}
.ph .ln{flex:1}
.x{width:3.6cqw;height:3.6cqw;border:.15cqw solid var(--line);transform:rotate(45deg);cursor:pointer;display:flex;align-items:center;justify-content:center}
.x span{transform:rotate(-45deg);font-size:2cqw}
.x:hover{background:#fff;color:#000}
.pb{flex:1;display:flex;min-height:0;margin-top:2cqh;gap:2cqw}
.tabs{width:18cqw;display:flex;flex-direction:column;gap:1.4cqh}
.tab{border:.12cqw solid #666;padding:1.2cqh 1.2cqw;font-size:1.8cqw;color:var(--dim);cursor:pointer;border-radius:1cqw}
.tab.act{background:linear-gradient(#bbb,#777);color:#000;border-color:#fff}
.tab.lock{opacity:.6;cursor:default}
.body{flex:1;overflow-y:auto;min-width:0;padding-right:1cqw}
.body::-webkit-scrollbar{width:.8cqw}.body::-webkit-scrollbar-thumb{background:#888;border-radius:1cqw}
/* 백로그 */
.log{display:flex;gap:1.6cqw;align-items:flex-start;padding:1.2cqh 0;border-bottom:.08cqw solid #333}
.av{flex:none;width:7cqw;height:7cqw;border-radius:50%;border:.2cqw solid #ccc;background:#222;display:flex;align-items:center;justify-content:center;font-size:2.4cqw;font-weight:700;overflow:hidden}
.lb{flex:1;min-width:0}
.ln2{font-size:1.5cqw;color:var(--dim);margin-bottom:.4cqh}
.lt{border:.12cqw solid #aaa;border-radius:1cqw;padding:1.4cqh 1.6cqw;font-size:1.9cqw;line-height:1.6;min-height:6cqh}
.empty{color:var(--dim);text-align:center;margin-top:10cqh;font-size:2cqw}
/* 수집 요소 */
.ct{font-size:2.4cqw;margin-bottom:1.6cqh;display:flex;gap:1.5cqw;align-items:baseline}
.ct small{font-size:1.6cqw;color:var(--dim)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqh 1.6cqw}
.it{display:flex;gap:1.4cqw;align-items:center;border:.12cqw solid #aaa;border-radius:1cqw;padding:1.4cqh 1.2cqw;min-height:13cqh;cursor:pointer}
.it:hover,.it.pick{background:#1e1e1e;box-shadow:0 0 1cqw #fff4}
.it .ic{flex:none;width:7cqw;height:7cqw;border:.12cqw solid #aaa;border-radius:.8cqw;background:#1b1b1b;display:flex;align-items:center;justify-content:center;font-size:3.2cqw}
.it.un{color:var(--dim)}.it.un .ic{background:#0c0c0c}
.it b{font-size:2cqw;display:block;margin-bottom:.4cqh}
.it p{font-size:1.5cqw;line-height:1.4;color:#cfcfcf}.it.un p{color:#777}
/* 환경설정 */
.row{display:flex;align-items:center;gap:1.6cqw;border:.12cqw solid #aaa;border-radius:1cqw;padding:1.4cqh 1.6cqw;margin-bottom:1.6cqh;font-size:1.9cqw;opacity:.75}
.row .lab{width:18cqw}
.row input[type=range]{flex:1;accent-color:#ddd}
.tg{display:flex;border:.1cqw solid #555;border-radius:3cqw;overflow:hidden}
.tg span{padding:.6cqh 2.4cqw;font-size:1.8cqw;color:#777}.tg .o{background:#ddd;color:#000}
.row.btn{cursor:pointer;opacity:1;justify-content:space-between}
.row.btn:hover{background:#fff;color:#000}
.notice{border:.12cqw dashed #aaa;border-radius:1cqw;padding:1.2cqh 1.6cqw;margin-bottom:1.8cqh;font-size:1.7cqw;text-align:center;background:#161616}
/* 엔딩 */
#end{position:absolute;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3cqh;z-index:15;font-size:3cqw}
#end.on{display:flex}
#end button{font:inherit;font-size:2cqw;background:none;color:var(--text);border:.15cqw solid var(--line);padding:1cqh 3cqw;cursor:pointer;border-radius:1cqw}
#end button:hover{background:#fff;color:#000}
</style>
</head>
<body>
<div id="stage">

<!-- 타이틀 -->
<section class="scr on" id="title">
  <div class="bg"></div>
  <img id="logo" alt="흑백 증후군">
  <div id="menu">
    <div class="mi sel" data-a="start">게임 시작</div>
    <div class="mi" data-a="opt">환경설정</div>
  </div>
  <div class="hint">↑ ↓ 선택 · Space / Enter 확인</div>
</section>

<!-- 게임 -->
<section class="scr" id="game">
  <div class="bg" id="gbg"></div><div class="shade"></div>
  <div class="chr" id="girl">
    <!-- 임시 스탠딩: 나중에 <img src="..."> 로 교체 -->
    <svg viewBox="0 0 300 600"><path d="M40 600 L50 260 Q150 170 250 260 L260 600Z" fill="#2a2a2a" stroke="#ddd" stroke-width="3"/><path d="M60 260 Q40 80 150 70 Q260 80 240 260 Q240 320 220 400 L210 260 Q150 200 90 260 L80 400 Q60 330 60 260Z" fill="#1a1a1a" stroke="#ddd" stroke-width="3"/><ellipse cx="150" cy="190" rx="62" ry="75" fill="#e8e8e8"/><ellipse cx="125" cy="195" rx="11" ry="16" fill="#111"/><ellipse cx="175" cy="195" rx="11" ry="16" fill="#111"/><path d="M135 240 h30" stroke="#444" stroke-width="3"/></svg>
  </div>
  <div class="chr" id="mono">
    <svg viewBox="0 0 300 300"><path d="M60 170 L10 110 L90 140Z M240 170 L290 110 L210 140Z" fill="#eee" stroke="#111" stroke-width="3"/><ellipse cx="150" cy="215" rx="55" ry="70" fill="#151515" stroke="#ddd" stroke-width="3"/><path d="M95 40 L110 10 L135 40Z M205 40 L190 10 L165 40Z" fill="#151515" stroke="#ddd" stroke-width="3"/><ellipse cx="150" cy="95" rx="78" ry="62" fill="#f0f0f0" stroke="#ddd" stroke-width="3"/><path d="M72 70 Q150 10 228 70 Q150 60 72 70Z" fill="#111"/><circle cx="120" cy="100" r="9" fill="#111"/><circle cx="180" cy="100" r="9" fill="#111"/><path d="M140 125 q10 10 20 0" stroke="#111" stroke-width="3" fill="none"/></svg>
  </div>
  <div id="side">
    <button class="ib" id="bLog" title="백로그">📖</button>
    <button class="ib" id="bItem" title="수집 요소">🖼</button>
    <button class="ib" id="bSet" title="환경설정">⚙</button>
  </div>
  <div id="box"><div id="name"></div><div id="txt"></div><div id="arrow">▼</div></div>
  <div id="end"><div>— 1화 끝 —</div><button id="toTitle">타이틀로</button></div>
</section>

<!-- 백로그 -->
<div class="modal" id="mLog"><div class="pop">
  <div class="ph"><span>📖 지난 대화 다시보기</span><div class="ln"></div><div class="x" data-close><span>✕</span></div></div>
  <div class="body" id="logBody" style="margin-top:2cqh"></div>
</div></div>

<!-- 수집 요소 -->
<div class="modal" id="mItem"><div class="pop">
  <div class="ph"><span>📖 수집 요소</span><div class="ln"></div><div class="x" data-close><span>✕</span></div></div>
  <div class="pb">
    <div class="tabs" id="chTabs"></div>
    <div class="body"><div class="ct">◇ <span id="chName">챕터 1</span><small id="chCnt"></small></div><div class="grid" id="itGrid"></div></div>
  </div>
</div></div>

<!-- 환경설정 -->
<div class="modal" id="mSet"><div class="pop" style="height:78cqh">
  <div class="ph"><span>⚙ 환경설정</span><div class="ln"></div><div class="x" data-close><span>✕</span></div></div>
  <div class="pb">
    <div class="tabs"><div class="tab act">⚙ 설정</div><div class="tab">☰ 기타</div></div>
    <div class="body">
      <div class="notice">아직 이용할 수 없는 기능입니다. (추후 업데이트 예정)</div>
      <div class="row"><span>♫</span><span class="lab">배경음악</span><input type="range" value="70" disabled><span>70%</span></div>
      <div class="row"><span>🔊</span><span class="lab">효과음</span><input type="range" value="70" disabled><span>70%</span></div>
      <div class="row"><span>💬</span><span class="lab">텍스트 생성 속도</span><span>🐢</span><input type="range" value="50" disabled><span>🐇</span></div>
      <div class="row"><span>💾</span><span class="lab">자동 저장</span><div class="tg"><span class="o">ON</span><span>OFF</span></div></div>
      <div class="row btn" id="goTitle" style="display:none"><span>⌂ 타이틀로 돌아가기</span><span>›</span></div>
    </div>
  </div>
</div></div>

</div>

});

const ITEMS = [
  ['📜','낡은 편지','누군가가 남긴 듯한 오래된 편지.'],
  ['📿','은빛 목걸이','빛바랜 은빛의 목걸이. 어디선가 본 듯한…'],
  ['📓','스케치북','누군가의 손길이 닿은 스케치북.'],
  ['🗝','작은 열쇠','낡았지만 아직 쓸 수 있는 열쇠.'],
  ['🧸','토끼 인형','오래된 것 같은 토끼 인형. 조금 낡아 보인다.'],
  ['🖼','사진 한 장','누군가와 함께한 듯한 사진.'],
  null, null
];

const $ = id => document.getElementById(id);
const state = {screen:'title', idx:-1, typing:false, timer:null, full:'', modal:null, menuSel:0, monoSeen:false, shown:[]};

function show(id){ document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id===id)); state.screen=id; }

/* ---------- 에셋 적용 ---------- */
if (ASSETS.titleBg) document.querySelector('#title .bg').style.setProperty('--title-image', `url(${ASSETS.titleBg})`);
if (ASSETS.logo) $('logo').src = ASSETS.logo;
if (ASSETS.gameBg) $('gbg').style.setProperty('--bg-image', `url(${ASSETS.gameBg})`);
if (ASSETS.girl) $('girl').innerHTML = `<img src="${ASSETS.girl}" alt="소녀">`;
if (ASSETS.mono) $('mono').innerHTML = `<img src="${ASSETS.mono}" alt="모노">`;

/* ---------- 타이틀 ---------- */
const menuEls = [...document.querySelectorAll('.mi')];
function setMenu(i){ state.menuSel=i; menuEls.forEach((e,k)=>e.classList.toggle('sel',k===i)); }
function menuDo(a){ if(a==='start') startGame(); else openModal('mSet'); }
menuEls.forEach((e,i)=>{
  e.addEventListener('mouseenter',()=>setMenu(i));
  e.addEventListener('click',ev=>{ev.stopPropagation(); setMenu(i); menuDo(e.dataset.a);});
});

/* ---------- 게임 진행 ---------- */
function startGame(){
  state.idx=-1; state.monoSeen=false; state.shown=[];
  $('end').classList.remove('on');
  $('girl').classList.add('show'); $('mono').classList.remove('show');
  show('game'); next();
}
function typeLine(l){
  clearInterval(state.timer);
  const who = l.who;
  $('name').textContent = who;
  $('name').style.visibility = who ? 'visible' : 'hidden';
  $('txt').textContent=''; $('arrow').style.display='none';
  if (who==='???' || who==='모노') state.monoSeen=true;
  $('mono').classList.toggle('show', state.monoSeen);
  $('girl').classList.toggle('dim', who==='???'||who==='모노');
  $('mono').classList.toggle('dim', who==='소녀');
  state.full=l.text; state.typing=true;
  let n=0;
  state.timer=setInterval(()=>{
    n++; $('txt').textContent=state.full.slice(0,n);
    if(n>=state.full.length) finish();
  }, CHAR_SPEED);
}
function finish(){
  clearInterval(state.timer); state.typing=false;
  $('txt').textContent=state.full; $('arrow').style.display='block';
}
function next(){
  if(state.idx>=LINES.length-1){ $('end').classList.add('on'); return; }
  state.idx++; const l=LINES[state.idx];
  state.shown.push(l); typeLine(l);
}
/* 한 번 누르면 즉시 출력, 한 번 더 누르면 다음 대사 */
function advance(){
  if(state.screen==='title'){ menuDo(menuEls[state.menuSel].dataset.a); return; }
  if(state.screen!=='game' || state.modal || $('end').classList.contains('on')) return;
  state.typing ? finish() : next();
}
$('stage').addEventListener('click',e=>{
  if(state.screen!=='game' || e.target.closest('#side,.modal,#end,.mi')) return;
  advance();
});
document.addEventListener('keydown',e=>{
  if(state.modal){ if(e.key==='Escape') closeModal(); return; }
  if(e.code==='Space'){ e.preventDefault(); advance(); }
  else if(state.screen==='title'){
    if(e.key==='ArrowDown') setMenu((state.menuSel+1)%menuEls.length);
    if(e.key==='ArrowUp') setMenu((state.menuSel+menuEls.length-1)%menuEls.length);
    if(e.key==='Enter') advance();
  }
});

/* ---------- 팝업 ---------- */
function openModal(id){
  if(id==='mLog') renderLog();
  if(id==='mItem') renderItems(0);
  if(id==='mSet') $('goTitle').style.display = state.screen==='game' ? 'flex':'none';
  state.modal=id; $(id).classList.add('on');
}
function closeModal(){ if(state.modal) $(state.modal).classList.remove('on'); state.modal=null; }
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) closeModal(); }));
$('bLog').onclick=()=>openModal('mLog');
$('bItem').onclick=()=>openModal('mItem');
$('bSet').onclick=()=>openModal('mSet');
$('goTitle').onclick=()=>{ closeModal(); toTitle(); };
$('toTitle').onclick=()=>toTitle();
function toTitle(){ clearInterval(state.timer); $('end').classList.remove('on'); show('title'); }

function renderLog(){
  const b=$('logBody'); b.innerHTML='';
  if(!state.shown.length){ b.innerHTML='<div class="empty">아직 대화 기록이 없습니다.</div>'; return; }
  state.shown.forEach((l,i)=>{
    const isCur = i===state.shown.length-1;
    const txt = isCur && state.typing ? state.full.slice(0,$('txt').textContent.length) : l.text;
    const d=document.createElement('div'); d.className='log';
    const av = l.who==='소녀'?'소': l.who?'모':'…';
    d.innerHTML = `<div class="av">${av}</div><div class="lb"><div class="ln2">${l.who||'독백'}</div><div class="lt"></div></div>`;
    d.querySelector('.lt').textContent=txt; b.appendChild(d);
  });
  b.scrollTop=b.scrollHeight;
}
function renderItems(ch){
  const tabs=$('chTabs'); tabs.innerHTML='';
  ['챕터 1','챕터 2','챕터 3','???','???','???'].forEach((n,i)=>{
    const t=document.createElement('div'); t.className='tab'+(i===ch?' act':'')+(i>2?' lock':'');
    t.textContent=(i>2?'🔒 ':'◇ ')+n;
    if(i<3) t.onclick=()=>renderItems(i); tabs.appendChild(t);
  });
  $('chName').textContent='챕터 '+(ch+1);
  const g=$('itGrid'); g.innerHTML='';
  const list = Array(8).fill(null); // 모든 챕터 미발견 상태 (발견 처리 시 ITEMS 사용)
  const got = list.filter(Boolean).length;
  $('chCnt').textContent=`(${got}/8)`;
  list.forEach(it=>{
    const d=document.createElement('div');
    if(it){ d.className='it'; d.innerHTML=`<div class="ic">${it[0]}</div><div><b>${it[1]}</b><p>${it[2]}</p></div>`;
      d.onclick=()=>{ g.querySelectorAll('.it').forEach(x=>x.classList.remove('pick')); d.classList.add('pick'); }; }
    else { d.className='it un'; d.innerHTML='<div class="ic">?</div><div><b>???</b><p>아직 발견하지 못한<br>수집 요소입니다.</p></div>'; }
    g.appendChild(d);
  });
}
</script>
</body>
</html>
